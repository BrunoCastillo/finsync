databases:
  - name: finsync-db
    databaseName: finsync
    user: finsync
    plan: free

services:
  - type: web
    name: finsync-api
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: finsync-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://finsync-tau.vercel.app
      - key: EMAIL_VERIFICATION_DEV_MODE
        value: "true"
